name: Update AltStore Source

on:
  release:
    types: [published]      # fires for releases created manually via the UI
  workflow_dispatch:        # manual trigger
  workflow_call:            # chained from release.yml (CI-created releases)

permissions:
  contents: write

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update AltStore source (apps.json) from latest release
        run: python .github/workflows/supporting/update_altstore_json.py

      - name: Publish apps.json to the altstore branch
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: altstore
          folder: .github/workflows/supporting/altstore
          git-config-name: github-actions[bot]
          git-config-email: github-actions[bot]@users.noreply.github.com
          commit-message: "Update AltStore source"
          single-commit: true
