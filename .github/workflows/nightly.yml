name: Build and upload nightly ipa

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # The parser engine lives in Nyora-Manga/nyora-ios-engine and is rebuilt there whenever
      # nyora-data-driven's patches.json changes, so iOS inherits android's source fixes without
      # a binary living in this repo. Falls back to the checked-in xcframework if the fetch fails,
      # so a release is never blocked on the engine repo being reachable.
      - name: Fetch the latest parser engine
        run: |
          if curl -fsSL -o /tmp/engine.zip \
              https://github.com/Nyora-Manga/nyora-ios-engine/releases/download/engine-latest/NyoraEngine.xcframework.zip; then
            rm -rf vendor/nyora-engine/NyoraEngine.xcframework
            mkdir -p vendor/nyora-engine
            unzip -q /tmp/engine.zip -d vendor/nyora-engine
            echo "using engine-latest from nyora-ios-engine"
          else
            echo "::warning::could not fetch engine-latest - building against the checked-in xcframework"
          fi
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Install Xcode platforms
        run: |
          xcrun simctl list > /dev/null # fixes next command sometimes failing
          xcodebuild -downloadPlatform iOS
      - name: Get commit SHA
        id: commitinfo
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          xcodebuild -project Nyora.xcodeproj -scheme "Nyora (iOS)" \
            -configuration Release archive -archivePath build/Nyora.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package ipa
        run: |
          mkdir Payload
          cp -r build/Nyora.xcarchive/Products/Applications/Nyora.app Payload
          zip -r "Nyora-iOS_nightly-${{ steps.commitinfo.outputs.sha_short }}.ipa" Payload
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nyora-iOS_nightly-${{ steps.commitinfo.outputs.sha_short }}
          path: Nyora-iOS_nightly-${{ steps.commitinfo.outputs.sha_short }}.ipa
          if-no-files-found: error
