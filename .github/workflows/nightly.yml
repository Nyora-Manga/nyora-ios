name: Build and upload nightly ipa

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # The parser engine is rebuilt out-of-band (from the standalone engine source tree,
      # refreshed whenever nyora-data-driven's patches.json changes) and published as the
      # rolling `engine-latest` release on this same repo, so iOS inherits android's source
      # fixes without a binary living in version control. Falls back to the checked-in
      # xcframework if the fetch fails, so a release is never blocked on that asset existing.
      - name: Fetch the latest parser engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release download engine-latest --repo ${{ github.repository }} \
              --pattern 'NyoraEngine.xcframework.zip' --output /tmp/engine.zip --clobber; then
            rm -rf vendor/nyora-engine/NyoraEngine.xcframework
            mkdir -p vendor/nyora-engine
            unzip -q /tmp/engine.zip -d vendor/nyora-engine
            echo "using engine-latest from ${{ github.repository }}"
          else
            echo "::warning::could not fetch engine-latest - building against the checked-in xcframework"
          fi
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.0"
      - name: Install Xcode platforms
        run: |
          xcrun simctl list > /dev/null # fixes next command sometimes failing
          xcodebuild -downloadPlatform iOS
      - name: Get commit SHA
        id: commitinfo
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          xcodebuild -project Nyora.xcodeproj -scheme "Nyora (iOS)" \
            -configuration Release archive -archivePath build/Nyora.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package ipa
        run: |
          mkdir Payload
          cp -r build/Nyora.xcarchive/Products/Applications/Nyora.app Payload
          zip -r "Nyora-iOS_nightly-${{ steps.commitinfo.outputs.sha_short }}.ipa" Payload
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nyora-iOS_nightly-${{ steps.commitinfo.outputs.sha_short }}
          path: Nyora-iOS_nightly-${{ steps.commitinfo.outputs.sha_short }}.ipa
          if-no-files-found: error
